name: Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Full verify on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

  package-win:
    name: Build and smoke Windows x64 installer
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        run: pnpm build

      - name: Package Windows x64 installer
        run: pnpm --dir apps/desktop exec electron-builder --win nsis --x64

      - name: Smoke the built installer
        run: pnpm --dir apps/desktop exec node scripts/verify-test-package.mjs win x64

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepwrite-windows-x64-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14
